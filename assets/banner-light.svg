<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" fill="none">
  <defs>
    <pattern id="grid-light" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#DED7C8" />
    </pattern>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1200" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7F0" />
      <stop offset="60%" stop-color="#F6F2E8" />
      <stop offset="100%" stop-color="#EFE9DC" />
    </linearGradient>
    <radialGradient id="glow-coral-l" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(970 115) rotate(135) scale(290 200)">
      <stop offset="0%" stop-color="#D94E28" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#D94E28" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-mint-l" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 210) scale(260 150)">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="250" rx="18" fill="url(#bg-light)" />
  <rect width="1200" height="250" rx="18" fill="url(#grid-light)" />
  <rect width="1200" height="250" rx="18" fill="url(#glow-coral-l)" />
  <rect width="1200" height="250" rx="18" fill="url(#glow-mint-l)" />
  <rect x="1" y="1" width="1198" height="248" rx="17" stroke="#D5CCB9" stroke-width="1.5" />

  <!-- Subtle architectural node graph on the right -->
  <g transform="translate(745, 38)">
    <path d="M 142 42 C 195 42, 195 96, 250 96" stroke="#C2411D" stroke-width="1.8" stroke-dasharray="5 4" fill="none" />
    <path d="M 142 134 C 195 134, 195 96, 250 96" stroke="#0F766E" stroke-width="1.8" fill="none" />
    <path d="M 358 96 L 392 96" stroke="#2563EB" stroke-width="1.8" fill="none" />

    <rect x="12" y="18" width="130" height="48" rx="11" fill="#FFFDF8" stroke="#C2411D" stroke-width="1.6" />
    <circle cx="30" cy="42" r="4.5" fill="#C2411D" />
    <text x="44" y="38" fill="#15222B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700">bot-link</text>
    <text x="44" y="53" fill="#5D6B78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">E2E agent rooms</text>

    <rect x="12" y="110" width="130" height="48" rx="11" fill="#FFFDF8" stroke="#0F766E" stroke-width="1.6" />
    <circle cx="30" cy="134" r="4.5" fill="#0F766E" />
    <text x="44" y="130" fill="#15222B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700">skot</text>
    <text x="44" y="145" fill="#5D6B78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">AI whiteboard</text>

    <rect x="250" y="68" width="108" height="56" rx="13" fill="#FFFDF8" stroke="#2563EB" stroke-width="1.6" />
    <text x="304" y="93" text-anchor="middle" fill="#15222B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">SHIPPED</text>
    <text x="304" y="110" text-anchor="middle" fill="#2563EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">local-first</text>

    <circle cx="402" cy="96" r="10" fill="#FFFDF8" stroke="#0F766E" stroke-width="1.8" />
    <path d="M 397.5 96 L 400.5 99 L 406.5 93" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Left Typography -->
  <g transform="translate(56, 54)">
    <rect x="0" y="0" width="186" height="26" rx="13" fill="#FFFDF8" stroke="#D5CCB9" stroke-width="1.2" />
    <circle cx="16" cy="13" r="4" fill="#0F766E" />
    <text x="29" y="17" fill="#3B4956" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">BENGALURU · BUILDER</text>

    <text x="0" y="76" fill="#15222B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">Charles MJ</text>
    <text x="0" y="111" fill="#465564" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400">Building multi-agent infrastructure, AI-native canvas tools &amp; local-first software.</text>

    <g transform="translate(0, 134)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="112" height="24" rx="7" fill="#FFFDF8" stroke="#D5CCB9" />
      <text x="56" y="16" text-anchor="middle" fill="#C2411D">Go · Rust · TS</text>

      <rect x="122" y="0" width="124" height="24" rx="7" fill="#FFFDF8" stroke="#D5CCB9" />
      <text x="184" y="16" text-anchor="middle" fill="#0F766E">Agent Systems</text>

      <rect x="256" y="0" width="122" height="24" rx="7" fill="#FFFDF8" stroke="#D5CCB9" />
      <text x="317" y="16" text-anchor="middle" fill="#2563EB">Swift · Kotlin</text>

      <rect x="388" y="0" width="134" height="24" rx="7" fill="#FFFDF8" stroke="#D5CCB9" />
      <text x="455" y="16" text-anchor="middle" fill="#9A6700">E2E &amp; Firmware</text>
    </g>
  </g>
</svg>
